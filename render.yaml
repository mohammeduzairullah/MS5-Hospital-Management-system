services:
  - type: web
    name: ms5-careflow-demo
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: MONGOMS_DISABLE_POSTINSTALL
        value: "1"
      - key: TZ
        value: Asia/Kolkata
      - key: JWT_SECRET
        generateValue: true
      - key: DEMO_ADMIN_PASSWORD
        generateValue: true
      - key: MONGODB_URI
        sync: false
